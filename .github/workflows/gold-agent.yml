name: Gold agent

on:
  schedule:
    # Every 10 min, 05:00–21:59 UTC (09:00–01:59 Dubai), Mon–Fri.
    # GitHub may delay scheduled runs by several minutes.
      - cron: "17 5-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a WhatsApp test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run signal engine
        run: python engine/agent.py
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          ACCOUNT_EQUITY: ${{ secrets.ACCOUNT_EQUITY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TEST_ALERT: ${{ inputs.test_alert }}

      - name: Commit results
        run: |
          git config user.name "gold-agent"
          git config user.email "gold-agent@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "signal $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
